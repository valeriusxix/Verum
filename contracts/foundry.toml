[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Spec §6: Solidity ^0.8.24. Pinned so the explorer verification is reproducible.
solc_version = "0.8.24"
# QIE mainnet (1990) and testnet (1983) support Shanghai (PUSH0) but NOT Cancun:
# TSTORE (0x5d) and MCOPY (0x5e) fail with "invalid opcode" (probed via eth_call, 16 Nov 2026).
# solc 0.8.24 defaults to cancun, so this must stay "shanghai".
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
qie = "https://rpc1mainnet.qie.digital/"
qie_testnet = "https://rpc1testnet.qie.digital/"

[fmt]
line_length = 110
